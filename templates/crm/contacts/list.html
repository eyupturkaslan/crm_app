{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Kişiler" %}{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold">{% translate "Kişiler" %}</h1>
    <div class="flex flex-wrap gap-2">
      <a href="{% url 'crm:contact_export' %}?{{ qs }}" class="btn-secondary">{% translate "Dışa Aktar" %}</a>
      <a href="{% url 'crm:contact_import' %}" class="btn-secondary">{% translate "İçe Aktar" %}</a>
      <a href="{% url 'crm:contact_create' %}" class="btn">+ {% translate "Yeni Kişi" %}</a>
    </div>
  </div>

  <form class="card flex flex-wrap gap-3 items-end"
        hx-get="{% url 'crm:contact_list' %}" hx-target="#rows" hx-push-url="true"
        hx-trigger="input changed delay:250ms from:find input[type=search], change from:find select, change from:find input[type=checkbox], submit">
    <div class="flex-1 min-w-[200px]">
      <label class="block text-xs font-medium mb-1 text-slate-500">{% translate "Ara" %}</label>
      <input type="search" name="q" value="{{ q }}" placeholder="{% translate 'Ad, e-posta, telefon…' %}" class="input">
    </div>
    <div class="min-w-[180px]">
      <label class="block text-xs font-medium mb-1 text-slate-500">{% translate "Yaşam Döngüsü" %}</label>
      <select name="lifecycle_stage" class="input">
        <option value="">{% translate "Tümü" %}</option>
        {% for value, label in lifecycle_choices %}
        <option value="{{ value }}" {% if value == lifecycle_stage %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <label class="flex items-center gap-2 text-sm pb-2 whitespace-nowrap">
      <input type="checkbox" name="owner" value="me" {% if owner_me %}checked{% endif %}>
      {% translate "Sadece bana ait" %}
    </label>
  </form>

  <div id="rows">
    {% include "crm/contacts/_table.html" %}
  </div>
</div>
{% endblock %}
