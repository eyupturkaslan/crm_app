{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Giriş" %}{% endblock %}
{% block auth_content %}
<form method="post" class="card w-full max-w-sm space-y-4">
  {% csrf_token %}
  <h1 class="text-xl font-semibold">◆ CRM</h1>
  {% if form.errors %}<p class="text-sm text-red-600">{% translate "Kullanıcı adı veya şifre hatalı." %}</p>{% endif %}
  <div class="form-field"><label class="block text-sm mb-1" for="id_username">{% translate "Kullanıcı adı" %}</label>{{ form.username }}</div>
  <div class="form-field"><label class="block text-sm mb-1" for="id_password">{% translate "Şifre" %}</label>{{ form.password }}</div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn w-full justify-center">{% translate "Giriş yap" %}</button>
</form>
{% endblock %}
